<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — OK Autonomous</title>
<meta name="description" content="The page you're looking for doesn't exist. Head back to OK Autonomous.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#152035">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#152035; --teal:#00b894; --sky:#f0f6ff;
    --muted:#7a8fa8; --mid:#3a4f6e; --rule:#d0daea; --white:#ffffff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:'Barlow', sans-serif; font-weight:300;
    background:var(--white); color:var(--navy);
    min-height:100vh; display:flex; flex-direction:column;
    overflow-x:hidden;
  }

  /* nav */
  nav {
    padding:20px 52px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--rule); background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
  }
  .nav-logo img { height:32px; display:block; }
  .nav-back {
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:700;
    color:var(--teal); text-decoration:none; padding-bottom:4px; border-bottom:1px solid var(--teal);
    display:inline-flex; align-items:center; gap:10px; transition:gap .3s;
  }
  .nav-back:hover { gap:16px; }
  .nav-back::before {
    content:''; display:inline-block; width:16px; height:1px; background:var(--teal);
  }

  /* main */
  main {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:80px 52px; position:relative;
  }
  .wrap { max-width:640px; text-align:center; position:relative; z-index:2; }

  .ghost {
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    font-family:'Bebas Neue', sans-serif; font-weight:700;
    font-size:clamp(240px, 40vw, 480px); line-height:1; letter-spacing:0;
    color:transparent; -webkit-text-stroke:1px var(--teal);
    opacity:.14; pointer-events:none; user-select:none; z-index:1;
    white-space:nowrap;
  }

  .kicker {
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--teal); margin-bottom:20px;
    display:inline-flex; align-items:center; gap:12px;
  }
  .kicker::before, .kicker::after {
    content:''; width:32px; height:1px; background:var(--teal);
  }

  h1 {
    font-family:'Bebas Neue', sans-serif; font-weight:700;
    font-size:clamp(48px, 7vw, 88px); line-height:1; letter-spacing:1px;
    color:var(--navy); margin-bottom:20px;
  }
  h1 .teal { color:var(--teal); }

  .lede {
    font-family:'Barlow', sans-serif; font-weight:300;
    font-size:17px; line-height:1.6; color:var(--mid);
    max-width:480px; margin:0 auto 40px;
  }

  .actions {
    display:flex; gap:20px; justify-content:center; flex-wrap:wrap;
    padding-top:32px; border-top:1px solid var(--rule); max-width:520px; margin:0 auto;
  }
  .cta {
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:700;
    color:var(--teal); text-decoration:none; padding-bottom:6px; border-bottom:1px solid var(--teal);
    display:inline-flex; align-items:center; gap:10px; transition:gap .3s;
  }
  .cta:hover { gap:16px; }

  /* footer */
  footer {
    padding:24px 52px; text-align:center;
    font-family:'Space Mono', monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); border-top:1px solid var(--rule);
  }
  footer a { color:inherit; text-decoration:none; }
  footer a:hover { color:var(--teal); }

  @media (max-width:640px) {
    nav { padding:16px 20px; }
    main { padding:60px 20px; }
    footer { padding:20px; font-size:9px; }
    .actions { gap:14px; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <img src="/images/logo-horizontal.png" alt="OK Autonomous">
  </a>
  <a href="/" class="nav-back">Return home</a>
</nav>

<main>
  <div class="ghost" aria-hidden="true">404</div>
  <div class="wrap">
    <div class="kicker">Signal lost</div>
    <h1>This page is <span class="teal">off-grid.</span></h1>
    <p class="lede">The URL you followed doesn't exist on our network — or it moved. Try one of the paths below, or head back to the homepage.</p>
    <div class="actions">
      <a href="/" class="cta">Homepage</a>
      <a href="/#doors" class="cta">Who We Serve</a>
      <a href="/#services" class="cta">Services</a>
      <a href="/team" class="cta">Team</a>
      <a href="/#contact" class="cta">Contact</a>
    </div>
  </div>
</main>

<footer>
  © 2026 OK Autonomous · Tulsa, Oklahoma · <a href="mailto:info@ok-as.com">info@ok-as.com</a>
</footer>

</body>
</html>
